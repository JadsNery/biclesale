<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aplicação web para cadastro e acesso ao bicicletário com reconhecimento facial">
    <title>Bicicletário - Acesso Seguro</title>

    <!-- Estilos Globais -->
    <link rel="stylesheet" href="assets/styles.css">

    <!-- Ícone do Site -->
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">

    <!-- Fontes do Google -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <!-- Firebase SDK -->
    <!-- Atualize a versão conforme necessário -->
    <script defer src="/__/firebase/11.6.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/11.6.0/firebase-auth-compat.js"></script>
    <script defer src="/__/firebase/11.6.0/firebase-database-compat.js"></script>
    <script defer src="/__/firebase/11.6.0/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/11.6.0/firebase-functions-compat.js"></script>
    <script defer src="/__/firebase/11.6.0/firebase-messaging-compat.js"></script>
    <script defer src="/__/firebase/11.6.0/firebase-storage-compat.js"></script>
    <script defer src="/__/firebase/11.6.0/firebase-analytics-compat.js"></script>
    <script defer src="/__/firebase/11.6.0/firebase-remote-config-compat.js"></script>
    <script defer src="/__/firebase/11.6.0/firebase-performance-compat.js"></script>
    <script defer src="/__/firebase/init.js?useEmulator=true"></script>
</head>
<body>
    <!-- Cabeçalho -->
    <header class="header">
        <div class="container">
            <h1>Bicicletário</h1>
            <nav>
                <ul class="nav-links">
                    <li><a href="/">Início</a></li>
                    <li><a href="/register">Cadastro</a></li>
                    <li><a href="/login">Login</a></li>
                    <li><a href="/history">Histórico</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="main-content">
        <div class="container">
            <h2>Bem-vindo ao Bicicletário!</h2>
            <p>Use o menu acima para acessar as funcionalidades.</p>

            <!-- Div para o leitor de QR Code -->
            <div id="qr-reader" style="width: 100%; max-width: 500px; margin: 20px auto;">
                <h3>Escaneie o QR Code</h3>
                <button id="camera-toggle" style="margin-bottom: 10px;">Abrir Câmera</button>
                <video id="camera-feed" autoplay playsinline style="width: 100%; border: 2px solid #ccc;"></video>    
                <p id="scan-result">Resultado do QR Code: Aguardando...</p>
            </div>
        </div>
    </main>

    <!-- Rodapé -->
    <footer class="footer">
        <div class="container">
            <p>&copy; <span id="current-year"></span> Bicicletário 2025. Direitos dos alunos.</p>
        </div>
    </footer>

    <!-- Scripts Personalizados -->
    <script src="/src/index.js" type="module"></script>

    <!-- Script para Verificar o Firebase -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const statusEl = document.querySelector("#firebase-status");

            try {
                // Inicializa o Firebase
                let app = firebase.app();
                let features = [
                    "auth",
                    "database",
                    "firestore",
                    "functions",
                    "messaging",
                    "storage",
                    "analytics",
                    "remoteConfig",
                    "performance",
                ].filter((feature) => typeof app[feature] === "function");

                statusEl.textContent = `Firebase SDK carregado com: ${features.join(", ")}`;
            } catch (e) {
                console.error(e);
                statusEl.textContent = "Erro ao carregar o Firebase SDK. Verifique o console.";
            }
        });

        // Atualiza o ano automaticamente
        document.getElementById("current-year").textContent = new Date().getFullYear();
    </script>

    <!-- Script para Controlar a Câmera -->
    <script>let isCameraActive = false; // Variável para rastrear o estado da câmera
let streamInstance = null; // Referência para o fluxo da câmera

document.addEventListener("DOMContentLoaded", async function () {
    const videoElement = document.getElementById("camera-feed");
    const cameraToggleBtn = document.getElementById("camera-toggle");

    // Função para iniciar a câmera
    async function startCamera() {
        try {
            // Solicita acesso à câmera
            streamInstance = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            videoElement.srcObject = streamInstance;

            // Exibe o vídeo ao vivo
            videoElement.play();

            isCameraActive = true;
            cameraToggleBtn.textContent = "Fechar Leitor QR Code";
        } catch (error) {
            console.error("Erro ao acessar a câmera:", error);
            alert("Não foi possível acessar a câmera. Certifique-se de que ela está disponível e habilitada.");
        }
    }

    // Função para parar a câmera
    function stopCamera() {
        if (streamInstance) {
            const tracks = streamInstance.getTracks();
            tracks.forEach(track => track.stop());
            videoElement.srcObject = null;
            streamInstance = null;
        }
        isCameraActive = false;
        cameraToggleBtn.textContent = "Abrir Leitor QR Code";
    }

    // Evento de clique no botão
    cameraToggleBtn.addEventListener("click", () => {
        if (isCameraActive) {
            stopCamera();
        } else {
            startCamera();
        }
    });
});
</script>
</body>
</html>
